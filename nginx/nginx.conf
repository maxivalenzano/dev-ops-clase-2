upstream backend_cluster {
    # Load balancing cluster across multiple backend containers/ports
    # Options: round_robin (default), least_conn, ip_hash
    server backend-1:3000 max_fails=2 fail_timeout=10s;
    # server backend-2:3000 max_fails=2 fail_timeout=10s;
}

upstream frontend_server {
    server frontend:8081;
}

server {
    listen 80;
    server_name localhost;

    # Proxy timeout limits (Set to 5s so you can easily test 504 Gateway Timeout!)
    proxy_connect_timeout 5s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;

    # Standard proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Route 1: Frontend SPA
    location / {
        proxy_pass http://frontend_server;
    }

    # Route 2: Backend API reverse proxy with load balancing
    location /api/ {
        proxy_pass http://backend_cluster;

        # Failover mechanism: if one backend fails or times out, try the next
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # Route 3: Direct Health check endpoint for curl
    location /health {
        proxy_pass http://backend_cluster;
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # Custom JSON errors for clear learning diagnostics
    error_page 502 /custom_502.json;
    location = /custom_502.json {
        default_type application/json;
        return 502 '{"status":502,"error":"Bad Gateway","instance":"Nginx Gateway","message":"Nginx could not reach any active backend instance (container down or OOM killed)"}';
    }

    error_page 504 /custom_504.json;
    location = /custom_504.json {
        default_type application/json;
        return 504 '{"status":504,"error":"Gateway Timeout","instance":"Nginx Gateway","message":"Backend took longer than proxy_read_timeout (5000ms)"}';
    }
}
