upstream backend_cluster {
    # In a Podman Pod, all containers share localhost (127.0.0.1)!
    server 127.0.0.1:3001 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:3002 max_fails=2 fail_timeout=10s;
}

upstream frontend_server {
    server 127.0.0.1:8081;
}

server {
    listen 80;
    server_name localhost;

    # Timeouts for lab experiments
    proxy_connect_timeout 5s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://frontend_server;
    }

    location /api/ {
        proxy_pass http://backend_cluster;
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # Route 3: Direct Health check endpoint for curl
    location /health {
        proxy_pass http://backend_cluster;
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    error_page 502 /custom_502.json;
    location = /custom_502.json {
        default_type application/json;
        return 502 '{"status":502,"error":"Bad Gateway","instance":"Nginx Pod Gateway","message":"Nginx could not reach any active backend instance on localhost"}';
    }

    error_page 504 /custom_504.json;
    location = /custom_504.json {
        default_type application/json;
        return 504 '{"status":504,"error":"Gateway Timeout","instance":"Nginx Pod Gateway","message":"Backend took longer than proxy_read_timeout (5000ms)"}';
    }
}
