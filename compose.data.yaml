# Persistent infrastructure has its own Compose project; application rollback never stops it.
name: devops-data
services:
  postgres:
    image: postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    container_name: lab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: devops
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
      - migrator_password
      - app_password
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "work_mem=2MB", "-c", "maintenance_work_mem=32MB", "-c", "max_connections=30", "-c", "log_statement=none"]
    shm_size: 64m
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devops"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      lab-network:
        aliases: [postgres]
networks:
  lab-network:
    external: true
    name: devops-lab_lab-network
volumes:
  postgres-data:
    name: devops-lab_postgres-data
secrets:
  postgres_password:
    file: ${SECRETS_DIR:-/opt/devops-lab/secrets}/postgres_password
  migrator_password:
    file: ${SECRETS_DIR:-/opt/devops-lab/secrets}/migrator_password
  app_password:
    file: ${SECRETS_DIR:-/opt/devops-lab/secrets}/app_password
