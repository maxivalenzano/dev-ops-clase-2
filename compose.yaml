version: '3.8'

services:
  # 1. Nginx Gateway & Reverse Proxy
  nginx:
    build:
      context: ./nginx
      dockerfile: Containerfile
    image: nginx:alpine
    container_name: lab-nginx
    restart: always
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend-1
    networks:
      - lab-network

  # 2. React 18 Frontend SPA
  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
    image: ${ACR_LOGIN_SERVER:-acrdevopsvalenzano.azurecr.io}/frontend:${IMAGE_TAG:-1.0.0}
    container_name: lab-frontend
    restart: unless-stopped
    networks:
      - lab-network

  # 3. Backend Instance 1 (.NET 10 Minimal API)
  backend-1:
    build:
      context: ./backend
      dockerfile: Containerfile
    image: ${ACR_LOGIN_SERVER:-acrdevopsvalenzano.azurecr.io}/backend:${IMAGE_TAG:-2.0.0}
    container_name: lab-backend-1
    restart: unless-stopped
    environment:
      - PORT=3000
      - INSTANCE_NAME=backend-dotnet-1
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    networks:
      - lab-network

networks:
  lab-network:
    driver: bridge
