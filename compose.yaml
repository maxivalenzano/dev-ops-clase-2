services:
  # 1. Nginx Gateway & Reverse Proxy
  nginx:
    build:
      context: ./nginx
      dockerfile: Containerfile
    image: nginx:alpine
    container_name: lab-nginx
    restart: always
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend-1
      - frontend-2
      - frontend-3
      - backend-1
      - backend-2
      - backend-3
    networks:
      - lab-network

  # 2. Frontend Replicas (React 18 SPA on Nginx)
  frontend-1:
    build:
      context: ./frontend
      dockerfile: Containerfile
    image: ${ACR_LOGIN_SERVER:-acrdevopsvalenzano.azurecr.io}/frontend:${IMAGE_TAG:-2.0.0}
    container_name: lab-frontend-1
    hostname: frontend-react-1
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    networks:
      - lab-network

  frontend-2:
    build:
      context: ./frontend
      dockerfile: Containerfile
    image: ${ACR_LOGIN_SERVER:-acrdevopsvalenzano.azurecr.io}/frontend:${IMAGE_TAG:-2.0.0}
    container_name: lab-frontend-2
    hostname: frontend-react-2
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    networks:
      - lab-network

  frontend-3:
    build:
      context: ./frontend
      dockerfile: Containerfile
    image: ${ACR_LOGIN_SERVER:-acrdevopsvalenzano.azurecr.io}/frontend:${IMAGE_TAG:-2.0.0}
    container_name: lab-frontend-3
    hostname: frontend-react-3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    networks:
      - lab-network

  # 3. Backend Instance 1 (.NET 10 Minimal API)
  backend-1:
    build:
      context: ./backend
      dockerfile: Containerfile
    image: ${ACR_LOGIN_SERVER:-acrdevopsvalenzano.azurecr.io}/backend:${IMAGE_TAG:-2.0.0}
    container_name: lab-backend-1
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - PORT=3000
      - INSTANCE_NAME=backend-dotnet-1
      - REDIS_CONNECTION=redis:6379
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    networks:
      - lab-network

  # Backend Instance 2 (.NET 10 Minimal API)
  backend-2:
    build:
      context: ./backend
      dockerfile: Containerfile
    image: ${ACR_LOGIN_SERVER:-acrdevopsvalenzano.azurecr.io}/backend:${IMAGE_TAG:-2.0.0}
    container_name: lab-backend-2
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - PORT=3000
      - INSTANCE_NAME=backend-dotnet-2
      - REDIS_CONNECTION=redis:6379
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    networks:
      - lab-network

  # Backend Instance 3 (.NET 10 Minimal API)
  backend-3:
    build:
      context: ./backend
      dockerfile: Containerfile
    image: ${ACR_LOGIN_SERVER:-acrdevopsvalenzano.azurecr.io}/backend:${IMAGE_TAG:-2.0.0}
    container_name: lab-backend-3
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - PORT=3000
      - INSTANCE_NAME=backend-dotnet-3
      - REDIS_CONNECTION=redis:6379
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    networks:
      - lab-network

  # 4. In-Memory Task Store & Cache (Redis)
  redis:
    image: redis:7-alpine
    container_name: lab-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - lab-network

networks:
  lab-network:
    driver: bridge

volumes:
  redis-data:
