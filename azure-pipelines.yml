# ==============================================================================
# Pipeline CI/CD Multi-Stage - DevOps Lab
# ==============================================================================
# Flujo desacoplado en 5 Stages:
# 1. Versioning: Cálculo automático de SemVer mediante Conventional Commits.
# 2. Quality Gate: Pruebas unitarias (.NET 10 xUnit), Cobertura, SonarQube Cloud SAST y Trivy.
# 3. Packaging: Build y publicación OCI obligatoria en GHCR.
# 4. PostgreSQL: backup, migración EF y comprobación de esquema.
# 5. CD: Despliegue continuo en EC2 mediante Docker Compose.
# ==============================================================================

name: $(Date:yyyyMMdd)$(Rev:.r)

parameters:
  - name: deployDemo
    displayName: 'Desplegar manualmente esta rama en EC2 para la demostración'
    type: boolean
    default: false
  - name: releasePhase
    displayName: 'Release de la demostración de migraciones'
    type: string
    default: P3
    values: [P1, P2, P3]

trigger:
  branches:
    include:
      - main
      - devel

variables:
  vmEnvironmentName: 'devops-ec2-env'
  backendImage: 'ghcr.io/maxivalenzano/dev-ops-backend'
  frontendImage: 'ghcr.io/maxivalenzano/dev-ops-frontend'
  migratorImage: 'ghcr.io/maxivalenzano/dev-ops-migrator'
  appUrl: 'http://18.216.227.211'

stages:
  # ----------------------------------------------------------------------------
  # STAGE 1: CÁLCULO DE VERSIONADO SEMÁNTICO (SemVer)
  # ----------------------------------------------------------------------------
  - stage: Versioning
    displayName: '1. Semantic Versioning'
    jobs:
      - job: CalculateSemVer
        displayName: 'Calcular Versión SemVer'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
            fetchDepth: 0 # Trae historial completo de Git para tags y commits

          - bash: |
              set -euo pipefail

              echo "==> Evaluando estrategia de versionado..."
              SOURCE_BRANCH="$(Build.SourceBranch)"
              COMMIT_MSG="$(git log -1 --pretty=%B)"
              echo "Rama/Ref: $SOURCE_BRANCH"
              echo "Último commit: $COMMIT_MSG"

              # 1. Si el trigger fue un Tag de Git (ej: v2.1.0), usar ese tag directamente
              if [[ "$SOURCE_BRANCH" == refs/tags/v* ]]; then
                SEMVER_TAG="${SOURCE_BRANCH#refs/tags/v}"
                echo "Tag detectado en Git: $SEMVER_TAG"
              else
                # 2. Buscar el último tag SemVer existente o arrancar en 2.0.0
                if git describe --tags --abbrev=0 --match "v[0-9]*" >/dev/null 2>&1; then
                  LAST_TAG=$(git describe --tags --abbrev=0 --match "v[0-9]*")
                  COMMIT_RANGE="${LAST_TAG}..HEAD"
                else
                  LAST_TAG="v2.0.0"
                  COMMIT_RANGE="HEAD"
                fi

                CLEAN_TAG="${LAST_TAG#v}"
                echo "Último tag base: $CLEAN_TAG"
                echo "Rango de commits analizados: $COMMIT_RANGE"

                # Parsear MAJOR.MINOR.PATCH
                IFS='.' read -r -a VERSION_PARTS <<< "$CLEAN_TAG"
                MAJOR="${VERSION_PARTS[0]:-2}"
                MINOR="${VERSION_PARTS[1]:-0}"
                PATCH="${VERSION_PARTS[2]:-0}"

                # 3. Evaluar historial acumulado de Conventional Commits
                COMMITS=$(git log $COMMIT_RANGE --pretty=%s 2>/dev/null || echo "")

                HAS_MAJOR=false
                HAS_MINOR=false
                PATCH_COUNT=0

                while IFS= read -r line; do
                  [[ -z "$line" ]] && continue
                  if echo "$line" | grep -Eq "^(feat!|fix!|BREAKING CHANGE:)"; then
                    HAS_MAJOR=true
                  elif echo "$line" | grep -Eq "^feat(\(.*\))?:"; then
                    HAS_MINOR=true
                  else
                    PATCH_COUNT=$((PATCH_COUNT + 1))
                  fi
                done <<< "$COMMITS"

                if [ "$HAS_MAJOR" = true ]; then
                  echo "Impacto acumulado: MAJOR (Breaking change detectado)"
                  MAJOR=$((MAJOR + 1))
                  MINOR=0
                  PATCH=0
                elif [ "$HAS_MINOR" = true ]; then
                  echo "Impacto acumulado: MINOR (Features detectadas) + $PATCH_COUNT patches"
                  MINOR=$((MINOR + 1))
                  PATCH=$PATCH_COUNT
                else
                  echo "Impacto acumulado: PATCH ($PATCH_COUNT fixes/cambios menores)"
                  PATCH=$((PATCH + PATCH_COUNT))
                fi

                # Si no hubo incremento diferencial, asegurar al menos 1
                if [ "$MAJOR.${MINOR}.${PATCH}" = "$CLEAN_TAG" ]; then
                  PATCH=$((PATCH + 1))
                fi

                SEMVER_TAG="${MAJOR}.${MINOR}.${PATCH}"
              fi

              echo "==> Versión SemVer final calculada: $SEMVER_TAG"

              # Exportar variable de salida para los siguientes stages
              echo "##vso[task.setvariable variable=SEMVER_TAG;isOutput=true]$SEMVER_TAG"
              MIGRATION_TARGET=$(python3 -c 'import json,sys; print(json.load(open("backend/schema-compatibility.json"))[sys.argv[1]]["targetMigration"])' '${{ parameters.releasePhase }}')
              echo "##vso[task.setvariable variable=MIGRATION_TARGET;isOutput=true]$MIGRATION_TARGET"
              # Actualizar el nombre visible del build en Azure DevOps
              echo "##vso[build.updatebuildnumber]$SEMVER_TAG"
            name: VersionOutput
            displayName: 'Determinar Tag SemVer'

  # ----------------------------------------------------------------------------
  # STAGE 2: QUALITY GATE & SAST (PRUEBAS, COBERTURA Y ANÁLISIS ESTÁTICO)
  # ----------------------------------------------------------------------------
  - stage: QualityGate
    displayName: '2. Quality Gate & SAST'
    dependsOn: Versioning
    jobs:
      # Job A: Calidad y Pruebas Unitarias Backend con SonarQube Cloud
      - job: BackendQuality
        displayName: 'Backend .NET 10 (Tests & SonarCloud)'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
            fetchDepth: 0 # Historial completo requerido por SonarQube Cloud para SCM Blame y ramas

          - task: UseDotNet@2
            displayName: 'Instalar .NET 10 SDK'
            inputs:
              packageType: 'sdk'
              version: '10.x'

          # 1. Preparar Análisis de SonarQube Cloud (SAST) - Solo en rama devel por limitación de plan Free
          - task: SonarCloudPrepare@4
            displayName: 'Preparar Análisis SonarQube Cloud'
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/devel'))
            inputs:
              SonarCloud: 'SonarCloud'
              organization: 'maxivalenzano'
              scannerMode: 'dotnet'
              projectKey: 'maxivalenzano_DevOps'
              projectName: 'DevOps'
              extraProperties: |
                sonar.cs.opencover.reportsPaths=$(Agent.TempDirectory)/**/coverage.opencover.xml
                sonar.cs.vstest.reportsPaths=$(Agent.TempDirectory)/**/*.trx
                sonar.exclusions=**/obj/**,**/bin/**,**/dist/**,**/node_modules/**

          # 2. Validación de compilación de Backend (.NET 10)
          - bash: |
              echo "==> Verificando compilación de Backend .NET 10..."
              dotnet build backend/Backend.csproj -c Release
            displayName: 'Validar Backend (.NET 10)'

          # 3. Ejecución de Pruebas Unitarias (.NET 10 con Cobertura)
          - bash: |
              echo "==> Ejecutando Pruebas Unitarias en .NET 10..."
              dotnet test tests/Backend.Tests/Backend.Tests.csproj \
                --configuration Release \
                --logger "trx;LogFileName=test_results.trx" \
                --results-directory $(Agent.TempDirectory) \
                --collect:"XPlat Code Coverage" \
                -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover,cobertura
            displayName: 'Ejecutar Tests Unitarios (.NET 10)'

          - task: PublishTestResults@2
            displayName: 'Publicar Resultados de Tests'
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '$(Agent.TempDirectory)/**/test_results.trx'
              failTaskOnFailedTests: true
            condition: succeededOrFailed()

          - task: PublishCodeCoverageResults@2
            displayName: 'Publicar Cobertura de Código'
            inputs:
              summaryFileLocation: '$(Agent.TempDirectory)/**/coverage.cobertura.xml'
            condition: succeededOrFailed()

          # 4. Ejecutar Análisis y Quality Gate en SonarQube Cloud
          - task: SonarCloudAnalyze@4
            displayName: 'Ejecutar Análisis SAST en SonarQube Cloud'
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/devel'))

          - task: SonarCloudPublish@4
            displayName: 'Evaluar y Publicar Quality Gate SonarQube Cloud'
            inputs:
              pollingTimeoutSec: '300'
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/devel'))

      # Job B: Validación de Frontend React y Auditoría de Vulnerabilidades
      - job: PostgreSQLIntegration
        displayName: 'PostgreSQL real: P1 → P2 → P3, migración de estado reversible, rollback y restore'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
          - bash: python3 scripts/test-release-reservation.py
            displayName: 'Verificar reserva persistente entre PostgreSQL y CD'
          - bash: bash scripts/test-postgresql.sh
            displayName: 'Probar imágenes reales y bundle EF en PostgreSQL descartable'
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: 'TestResults/postgresql.xml'
              testRunTitle: 'PostgreSQL / EF / compatibilidad de releases'
              failTaskOnFailedTests: true

      - job: FrontendAndSecurity
        displayName: 'Frontend React 18 & Auditoría Trivy'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          # 1. Validación de compilación de Frontend
          - bash: |
              echo "==> Verificando dependencias y build de Frontend React..."
              cd frontend
              npm ci
              npm run build
            displayName: 'Validar Frontend (React 18 / Vite)'

          # 2. Análisis SAST Complementario de Contenedores y Dependencias (Trivy)
          - bash: |
              echo "==> Ejecutando auditoría de seguridad SAST con Trivy..."
              curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
              trivy fs --severity HIGH,CRITICAL --exit-code 0 .
            displayName: 'Auditoría SAST (Trivy Security Scanner)'
            continueOnError: true

  # ----------------------------------------------------------------------------
  # STAGE 3: PACKAGING (BUILD & PUSH DE IMÁGENES DOCKER / OCI)
  # ----------------------------------------------------------------------------
  - stage: Packaging
    displayName: '3. Packaging: Build & Push OCI'
    dependsOn:
      - Versioning
      - QualityGate
    variables:
      SEMVER_TAG: $[ stageDependencies.Versioning.CalculateSemVer.outputs['VersionOutput.SEMVER_TAG'] ]
    jobs:
      - job: BuildAndPushContainers
        displayName: 'Compilar y Publicar Contenedores en GHCR'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - bash: |
              set -euo pipefail
              IMAGE_TAG="$(SEMVER_TAG)-build.$(Build.BuildId)"
              SOURCE_COMMIT="$(Build.SourceVersion)"
              echo "==> Autenticando en GHCR y publicando tag ${IMAGE_TAG}"
              printf '%s' "$GHCR_PUSH_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
              docker build \
                --platform linux/amd64 \
                --build-arg 'TASK_RELEASE=${{ parameters.releasePhase }}' \
                --label "org.opencontainers.image.source=https://github.com/maxivalenzano/dev-ops-clase-2" \
                --label "org.opencontainers.image.revision=${SOURCE_COMMIT}" \
                -t "$(backendImage):${IMAGE_TAG}" \
                -f backend/Containerfile backend
              docker push "$(backendImage):${IMAGE_TAG}"

              docker build \
                --platform linux/amd64 \
                --build-arg "VITE_APP_VERSION=$(SEMVER_TAG)" \
                --build-arg 'VITE_TASK_RELEASE=${{ parameters.releasePhase }}' \
                --label "org.opencontainers.image.source=https://github.com/maxivalenzano/dev-ops-clase-2" \
                --label "org.opencontainers.image.revision=${SOURCE_COMMIT}" \
                -t "$(frontendImage):${IMAGE_TAG}" \
                -f frontend/Containerfile frontend
              docker push "$(frontendImage):${IMAGE_TAG}"

              docker build --platform linux/amd64 \
                --label "org.opencontainers.image.source=https://github.com/maxivalenzano/dev-ops-clase-2" \
                --label "org.opencontainers.image.revision=${SOURCE_COMMIT}" \
                -t "$(migratorImage):${IMAGE_TAG}" -f backend/Containerfile.migrator .
              docker push "$(migratorImage):${IMAGE_TAG}"
              bash scripts/build-migration-artifacts.sh
              python3 - <<'PY'
              import json, os
              from pathlib import Path
              phase = os.environ['RELEASE_PHASE']
              compatibility = json.loads(Path('backend/schema-compatibility.json').read_text())[phase]
              manifest = dict(compatibility, phase=phase, sourceCommit=os.environ['BUILD_SOURCEVERSION'],
                              buildId=os.environ['BUILD_BUILDID'], imageTag=os.environ['RELEASE_TAG'])
              Path('migration-artifacts/release.json').write_text(json.dumps(manifest, indent=2))
              PY
            displayName: 'Build & Push Backend, Frontend y Migrador del mismo SHA'
            env:
              GHCR_PUSH_TOKEN: $(GHCR_PUSH_TOKEN)
              GHCR_USERNAME: 'maxivalenzano'
              RELEASE_PHASE: '${{ parameters.releasePhase }}'
              RELEASE_TAG: '$(SEMVER_TAG)-build.$(Build.BuildId)'
              MIGRATOR_IMAGE: $(migratorImage)
          - publish: migration-artifacts
            artifact: migrations
            displayName: 'Publicar bundle, SQL de avance/inverso y manifiesto'

  # ----------------------------------------------------------------------------
  # STAGE 4: POSTGRESQL - PREPARACIÓN, BACKUP Y MIGRACIONES EF
  # ----------------------------------------------------------------------------
  - stage: PostgreSQL
    displayName: '4. PostgreSQL: preparación y migraciones EF'
    dependsOn:
      - Versioning
      - Packaging
    condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.SourceBranch'], 'refs/heads/devel'), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'), and(eq(variables['Build.Reason'], 'Manual'), ${{ eq(parameters.deployDemo, true) }})), ne(variables['Build.Reason'], 'PullRequest'))
    variables:
      SEMVER_TAG: $[ stageDependencies.Versioning.CalculateSemVer.outputs['VersionOutput.SEMVER_TAG'] ]
      MIGRATION_TARGET: $[ stageDependencies.Versioning.CalculateSemVer.outputs['VersionOutput.MIGRATION_TARGET'] ]
    jobs:
      - deployment: PrepareDatabase
        displayName: 'Reservar release, respaldar, migrar y validar'
        environment:
          name: $(vmEnvironmentName)
          resourceName: ec2-devops
          resourceType: VirtualMachine
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - download: current
                  artifact: migrations
                - bash: |
                    set -euo pipefail
                    mkdir -p "$BACKUP_EXPORT_DIR"
                    bash scripts/prepare-postgresql.sh
                  displayName: 'Preflight → backup/restore → migrador EF → validación'
                  env:
                    IMAGE_TAG: '$(SEMVER_TAG)-build.$(Build.BuildId)'
                    SOURCE_COMMIT: $(Build.SourceVersion)
                    BUILD_ID: $(Build.BuildId)
                    RELEASE_PHASE: '${{ parameters.releasePhase }}'
                    MIGRATION_TARGET: $(MIGRATION_TARGET)
                    MIGRATOR_IMAGE: $(migratorImage)
                    BACKEND_IMAGE: $(backendImage)
                    FRONTEND_IMAGE: $(frontendImage)
                    GHCR_PULL_TOKEN: $(GHCR_PULL_TOKEN)
                    GHCR_USERNAME: 'maxivalenzano'
                    BACKUP_EXPORT_DIR: '$(Pipeline.Workspace)/database-backup/$(Build.BuildId)'
                - publish: /opt/devops-lab/releases/$(Build.BuildId)
                  artifact: postgresql-evidence
                  displayName: 'Publicar recibo sin secretos'
                  condition: succeededOrFailed()
                - publish: $(Pipeline.Workspace)/database-backup/$(Build.BuildId)
                  artifact: database-backup
                  displayName: 'Guardar copia fuera de EC2 (acceso restringido al build)'
                  condition: succeededOrFailed()

  # ----------------------------------------------------------------------------
  # STAGE 5: ENTREGA CONTINUA (CD) - DESPLIEGUE A EC2
  # ----------------------------------------------------------------------------
  - stage: CD
    displayName: '5. CD: Despliegue en EC2'
    dependsOn:
      - Versioning
      - Packaging
      - PostgreSQL
    condition: and(succeeded(), eq(dependencies.PostgreSQL.result, 'Succeeded'), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.SourceBranch'], 'refs/heads/devel'), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'), and(eq(variables['Build.Reason'], 'Manual'), ${{ eq(parameters.deployDemo, true) }})), ne(variables['Build.Reason'], 'PullRequest'))
    variables:
      SEMVER_TAG: $[ stageDependencies.Versioning.CalculateSemVer.outputs['VersionOutput.SEMVER_TAG'] ]
      MIGRATION_TARGET: $[ stageDependencies.Versioning.CalculateSemVer.outputs['VersionOutput.MIGRATION_TARGET'] ]
    jobs:
      - deployment: DeployToVM
        displayName: 'Desplegar en EC2'
        environment:
          name: $(vmEnvironmentName)
          resourceName: ec2-devops
          resourceType: VirtualMachine
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  fetchDepth: 0

                - bash: |
                    set -euo pipefail
                    bash scripts/deploy-ec2.sh
                  displayName: 'Desplegar y verificar en EC2'
                  env:
                    IMAGE_TAG: '$(SEMVER_TAG)-build.$(Build.BuildId)'
                    BACKEND_IMAGE: $(backendImage)
                    FRONTEND_IMAGE: $(frontendImage)
                    APP_URL: $(appUrl)
                    SOURCE_COMMIT: $(Build.SourceVersion)
                    BUILD_ID: $(Build.BuildId)
                    RELEASE_PHASE: '${{ parameters.releasePhase }}'
                    MIGRATION_TARGET: $(MIGRATION_TARGET)
                    GHCR_PULL_TOKEN: $(GHCR_PULL_TOKEN)
                    GHCR_USERNAME: 'maxivalenzano'

                - bash: |
                    set -euo pipefail
                    if [[ -z "${GITHUB_RELEASE_TOKEN:-}" || "$GITHUB_RELEASE_TOKEN" == '$('* ]]; then
                      echo 'GitHub release metadata skipped: GITHUB_RELEASE_TOKEN is not configured.'
                      exit 0
                    fi
                    python3 scripts/publish-github-release.py
                  displayName: 'Publicar Release y Deployment en GitHub (opcional)'
                  continueOnError: true
                  env:
                    GITHUB_RELEASE_TOKEN: $(GITHUB_RELEASE_TOKEN)
                    SEMVER_TAG: $(SEMVER_TAG)
                    IMAGE_TAG: '$(SEMVER_TAG)-build.$(Build.BuildId)'
                    SOURCE_COMMIT: $(Build.SourceVersion)
                    APP_URL: $(appUrl)
