  # ==============================================================================
# Pipeline CI/CD Multi-Stage - DevOps Lab
# ==============================================================================
# Flujo desacoplado en 4 Stages:
# 1. Versioning: Cálculo automático de SemVer mediante Conventional Commits.
# 2. Quality Gate: Pruebas unitarias (.NET 10 xUnit), Cobertura, SonarQube Cloud SAST y Trivy.
# 3. Packaging: Empaquetado inmutable y publicación OCI hacia Azure Container Registry (ACR) y GHCR.
# 4. CD: Despliegue continuo hacia la VM Ubuntu en Azure mediante Docker Compose y Release Notes.
# ==============================================================================

name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
      - devel
  tags:
    include:
      - v*

variables:
  # Nombre de la Service Connection creada en Azure DevOps hacia tu ACR
  acrServiceConnection: 'acrdevopsvalenzano-sc'
  acrLoginServer: 'acrdevopsvalenzano.azurecr.io'
  # Nombre del Environment de Azure DevOps donde está registrada tu VM
  vmEnvironmentName: 'devops-vm-env'

stages:
  # ----------------------------------------------------------------------------
  # STAGE 1: CÁLCULO DE VERSIONADO SEMÁNTICO (SemVer)
  # ----------------------------------------------------------------------------
  - stage: Versioning
    displayName: '1. Semantic Versioning'
    jobs:
      - job: CalculateSemVer
        displayName: 'Calcular Versión SemVer'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
            fetchDepth: 0 # Trae historial completo de Git para tags y commits

          - bash: |
              set -euo pipefail

              echo "==> Evaluando estrategia de versionado..."
              SOURCE_BRANCH="$(Build.SourceBranch)"
              COMMIT_MSG="$(git log -1 --pretty=%B)"
              echo "Rama/Ref: $SOURCE_BRANCH"
              echo "Último commit: $COMMIT_MSG"

              # 1. Si el trigger fue un Tag de Git (ej: v2.1.0), usar ese tag directamente
              if [[ "$SOURCE_BRANCH" == refs/tags/v* ]]; then
                SEMVER_TAG="${SOURCE_BRANCH#refs/tags/v}"
                echo "Tag detectado en Git: $SEMVER_TAG"
              else
                # 2. Buscar el último tag SemVer existente o arrancar en 2.0.0
                if git describe --tags --abbrev=0 --match "v[0-9]*" >/dev/null 2>&1; then
                  LAST_TAG=$(git describe --tags --abbrev=0 --match "v[0-9]*")
                  COMMIT_RANGE="${LAST_TAG}..HEAD"
                else
                  LAST_TAG="v2.0.0"
                  COMMIT_RANGE="HEAD"
                fi

                CLEAN_TAG="${LAST_TAG#v}"
                echo "Último tag base: $CLEAN_TAG"
                echo "Rango de commits analizados: $COMMIT_RANGE"

                # Parsear MAJOR.MINOR.PATCH
                IFS='.' read -r -a VERSION_PARTS <<< "$CLEAN_TAG"
                MAJOR="${VERSION_PARTS[0]:-2}"
                MINOR="${VERSION_PARTS[1]:-0}"
                PATCH="${VERSION_PARTS[2]:-0}"

                # 3. Evaluar historial acumulado de Conventional Commits
                COMMITS=$(git log $COMMIT_RANGE --pretty=%s 2>/dev/null || echo "")

                HAS_MAJOR=false
                HAS_MINOR=false
                PATCH_COUNT=0

                while IFS= read -r line; do
                  [[ -z "$line" ]] && continue
                  if echo "$line" | grep -Eq "^(feat!|fix!|BREAKING CHANGE:)"; then
                    HAS_MAJOR=true
                  elif echo "$line" | grep -Eq "^feat(\(.*\))?:"; then
                    HAS_MINOR=true
                  else
                    PATCH_COUNT=$((PATCH_COUNT + 1))
                  fi
                done <<< "$COMMITS"

                if [ "$HAS_MAJOR" = true ]; then
                  echo "Impacto acumulado: MAJOR (Breaking change detectado)"
                  MAJOR=$((MAJOR + 1))
                  MINOR=0
                  PATCH=0
                elif [ "$HAS_MINOR" = true ]; then
                  echo "Impacto acumulado: MINOR (Features detectadas) + $PATCH_COUNT patches"
                  MINOR=$((MINOR + 1))
                  PATCH=$PATCH_COUNT
                else
                  echo "Impacto acumulado: PATCH ($PATCH_COUNT fixes/cambios menores)"
                  PATCH=$((PATCH + PATCH_COUNT))
                fi

                # Si no hubo incremento diferencial, asegurar al menos 1
                if [ "$MAJOR.${MINOR}.${PATCH}" = "$CLEAN_TAG" ]; then
                  PATCH=$((PATCH + 1))
                fi

                SEMVER_TAG="${MAJOR}.${MINOR}.${PATCH}"
              fi

              echo "==> Versión SemVer final calculada: $SEMVER_TAG"

              # Exportar variable de salida para los siguientes stages
              echo "##vso[task.setvariable variable=SEMVER_TAG;isOutput=true]$SEMVER_TAG"
              # Actualizar el nombre visible del build en Azure DevOps
              echo "##vso[build.updatebuildnumber]$SEMVER_TAG"
            name: VersionOutput
            displayName: 'Determinar Tag SemVer'

  # ----------------------------------------------------------------------------
  # STAGE 2: QUALITY GATE & SAST (PRUEBAS, COBERTURA Y ANÁLISIS ESTÁTICO)
  # ----------------------------------------------------------------------------
  - stage: QualityGate
    displayName: '2. Quality Gate & SAST'
    dependsOn: Versioning
    jobs:
      # Job A: Calidad y Pruebas Unitarias Backend con SonarQube Cloud
      - job: BackendQuality
        displayName: 'Backend .NET 10 (Tests & SonarCloud)'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - task: UseDotNet@2
            displayName: 'Instalar .NET 10 SDK'
            inputs:
              packageType: 'sdk'
              version: '10.x'
            continueOnError: true # No bloquea si el agente de Azure aún no tiene el feed oficial

          # 1. Preparar Análisis de SonarQube Cloud (SAST)
          - task: SonarCloudPrepare@3
            displayName: 'Preparar Análisis SonarQube Cloud'
            inputs:
              SonarCloud: 'SonarCloud'
              organization: 'maxivalenzano'
              scannerMode: 'dotnet'
              projectKey: 'maxivalenzano_DevOps'
              projectName: 'DevOps'
              extraProperties: |
                sonar.cs.opencover.reportsPaths=$(Agent.TempDirectory)/**/coverage.opencover.xml,$(Build.SourcesDirectory)/**/coverage.opencover.xml
                sonar.cs.vstest.reportsPaths=$(Agent.TempDirectory)/**/*.trx
                sonar.exclusions=**/obj/**,**/bin/**,**/dist/**,**/node_modules/**

          # 2. Validación de compilación de Backend (.NET 10)
          - bash: |
              echo "==> Verificando compilación de Backend .NET 10..."
              dotnet build backend/Backend.csproj -c Release
            displayName: 'Validar Backend (.NET 10)'

          # 3. Ejecución de Pruebas Unitarias (.NET 10 con Cobertura)
          - bash: |
              echo "==> Ejecutando Pruebas Unitarias en .NET 10..."
              dotnet test tests/Backend.Tests/Backend.Tests.csproj \
                --configuration Release \
                --logger "trx;LogFileName=test_results.trx" \
                --collect:"XPlat Code Coverage" \
                -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover,cobertura
            displayName: 'Ejecutar Tests Unitarios (.NET 10)'

          - task: PublishTestResults@2
            displayName: 'Publicar Resultados de Tests'
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '**/test_results.trx'
              failTaskOnFailedTests: true
            condition: succeededOrFailed()

          - task: PublishCodeCoverageResults@2
            displayName: 'Publicar Cobertura de Código'
            inputs:
              summaryFileLocation: '**/coverage.cobertura.xml'
            condition: succeededOrFailed()

          # 4. Ejecutar Análisis y Quality Gate en SonarQube Cloud
          - task: SonarCloudAnalyze@3
            displayName: 'Ejecutar Análisis SAST en SonarQube Cloud'

          - task: SonarCloudPublish@3
            displayName: 'Evaluar y Publicar Quality Gate SonarQube Cloud'
            inputs:
              pollingTimeoutSec: '300'
            continueOnError: true

      # Job B: Validación de Frontend React y Auditoría de Vulnerabilidades
      - job: FrontendAndSecurity
        displayName: 'Frontend React 18 & Auditoría Trivy'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          # 1. Validación de compilación de Frontend
          - bash: |
              echo "==> Verificando dependencias y build de Frontend React..."
              cd frontend
              npm ci
              npm run build
            displayName: 'Validar Frontend (React 18 / Vite)'

          # 2. Análisis SAST Complementario de Contenedores y Dependencias (Trivy)
          - bash: |
              echo "==> Ejecutando auditoría de seguridad SAST con Trivy..."
              curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
              trivy fs --severity HIGH,CRITICAL --exit-code 0 .
            displayName: 'Auditoría SAST (Trivy Security Scanner)'
            continueOnError: true

  # ----------------------------------------------------------------------------
  # STAGE 3: PACKAGING (BUILD & PUSH DE IMÁGENES DOCKER / OCI)
  # ----------------------------------------------------------------------------
  - stage: Packaging
    displayName: '3. Packaging: Build & Push OCI'
    dependsOn:
      - Versioning
      - QualityGate
    variables:
      SEMVER_TAG: $[ stageDependencies.Versioning.CalculateSemVer.outputs['VersionOutput.SEMVER_TAG'] ]
    jobs:
      - job: BuildAndPushContainers
        displayName: 'Compilar y Publicar Contenedores (ACR & GHCR)'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          # 1. Autenticación contra Azure Container Registry
          - task: Docker@2
            displayName: 'Docker Login a ACR'
            inputs:
              command: 'login'
              containerRegistry: $(acrServiceConnection)

          # 2. Construcción y publicación de Backend a ACR y GHCR
          - bash: |
              echo "==> Construyendo imagen Backend con tag: $(SEMVER_TAG)"
              docker build \
                --label "org.opencontainers.image.source=https://github.com/maxivalenzano/dev-ops-clase-2" \
                --label "org.opencontainers.image.description=Backend .NET 10 Microservice" \
                -t $(acrLoginServer)/backend:$(SEMVER_TAG) \
                -t $(acrLoginServer)/backend:latest \
                -f backend/Containerfile backend

              echo "==> Pusheando imagen Backend a ACR..."
              docker push $(acrLoginServer)/backend:$(SEMVER_TAG)
              docker push $(acrLoginServer)/backend:latest

              # Si GITHUB_PAT está configurado, publicar también en GitHub Packages (GHCR) de forma no bloqueante
              if [ -n "${GITHUB_PAT:-}" ] && [ "${GITHUB_PAT}" != "\$(GITHUB_PAT)" ]; then
                echo "==> Autenticando y publicando imagen Backend en GitHub Packages (GHCR)..."
                if echo "${GITHUB_PAT}" | docker login ghcr.io -u maxivalenzano --password-stdin 2>/dev/null; then
                  docker tag $(acrLoginServer)/backend:$(SEMVER_TAG) ghcr.io/maxivalenzano/dev-ops-backend:$(SEMVER_TAG)
                  docker tag $(acrLoginServer)/backend:latest ghcr.io/maxivalenzano/dev-ops-backend:latest
                  docker push ghcr.io/maxivalenzano/dev-ops-backend:$(SEMVER_TAG) || echo "==> [Aviso] No se pudo pushear tag semver a GHCR."
                  docker push ghcr.io/maxivalenzano/dev-ops-backend:latest || echo "==> [Aviso] No se pudo pushear tag latest a GHCR."
                  echo "==> Sincronización de Backend con GHCR finalizada."
                else
                  echo "==> [Aviso] No se pudo autenticar contra ghcr.io (revisar GITHUB_PAT)."
                fi
              fi
            displayName: 'Build & Push Backend OCI (ACR + GHCR)'
            env:
              GITHUB_PAT: $(GITHUB_PAT)

          # 3. Construcción y publicación de Frontend a ACR y GHCR
          - bash: |
              echo "==> Construyendo imagen Frontend con tag: $(SEMVER_TAG)"
              docker build \
                --build-arg VITE_APP_VERSION="$(SEMVER_TAG)" \
                --label "org.opencontainers.image.source=https://github.com/maxivalenzano/dev-ops-clase-2" \
                --label "org.opencontainers.image.description=Frontend React 18 / Vite SPA" \
                -t $(acrLoginServer)/frontend:$(SEMVER_TAG) \
                -t $(acrLoginServer)/frontend:latest \
                -f frontend/Containerfile frontend

              echo "==> Pusheando imagen Frontend a ACR..."
              docker push $(acrLoginServer)/frontend:$(SEMVER_TAG)
              docker push $(acrLoginServer)/frontend:latest

              # Si GITHUB_PAT está configurado, publicar también en GitHub Packages (GHCR) de forma no bloqueante
              if [ -n "${GITHUB_PAT:-}" ] && [ "${GITHUB_PAT}" != "\$(GITHUB_PAT)" ]; then
                echo "==> Autenticando y publicando imagen Frontend en GitHub Packages (GHCR)..."
                if echo "${GITHUB_PAT}" | docker login ghcr.io -u maxivalenzano --password-stdin 2>/dev/null; then
                  docker tag $(acrLoginServer)/frontend:$(SEMVER_TAG) ghcr.io/maxivalenzano/dev-ops-frontend:$(SEMVER_TAG)
                  docker tag $(acrLoginServer)/frontend:latest ghcr.io/maxivalenzano/dev-ops-frontend:latest
                  docker push ghcr.io/maxivalenzano/dev-ops-frontend:$(SEMVER_TAG) || echo "==> [Aviso] No se pudo pushear tag semver frontend a GHCR."
                  docker push ghcr.io/maxivalenzano/dev-ops-frontend:latest || echo "==> [Aviso] No se pudo pushear tag latest frontend a GHCR."
                  echo "==> Sincronización de Frontend con GHCR finalizada."
                else
                  echo "==> [Aviso] No se pudo autenticar contra ghcr.io (revisar GITHUB_PAT)."
                fi
              fi
            displayName: 'Build & Push Frontend OCI (ACR + GHCR)'
            env:
              GITHUB_PAT: $(GITHUB_PAT)

  # ----------------------------------------------------------------------------
  # STAGE 4: ENTREGA CONTINUA (CD) - DESPLIEGUE A VM LINUX EN AZURE
  # ----------------------------------------------------------------------------
  - stage: CD
    displayName: '4. CD: Despliegue en VM Linux'
    dependsOn:
      - Versioning
      - Packaging
    condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/devel', 'refs/tags/v*'), ne(variables['Build.Reason'], 'PullRequest'))
    variables:
      SEMVER_TAG: $[ stageDependencies.Versioning.CalculateSemVer.outputs['VersionOutput.SEMVER_TAG'] ]
    jobs:
      - deployment: DeployToVM
        displayName: 'Desplegar en VM Azure'
        environment:
          name: $(vmEnvironmentName)
          resourceType: VirtualMachine
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - bash: |
                    set -euo pipefail
                    echo "========================================================"
                    echo " Desplegando versión $(SEMVER_TAG) en $(Agent.Name)"
                    echo " Servidor de registro: $(acrLoginServer)"
                    echo "========================================================"

                    export IMAGE_TAG="$(SEMVER_TAG)"
                    export ACR_LOGIN_SERVER="$(acrLoginServer)"
                    export COMPOSE_PROJECT_NAME="devops-lab"

                    echo "==> Descargando nuevas imágenes desde ACR..."
                    docker compose pull

                    echo "==> Levantando contenedores actualizados..."
                    docker compose up -d --remove-orphans

                    echo "==> Refrescando Gateway Nginx para sincronizar DNS interno..."
                    docker compose restart nginx

                    echo "==> Esperando estabilización de servicios..."
                    sleep 5

                    echo "==> Ejecutando Smoke Test contra Nginx y Backend..."
                    curl -fsS http://localhost/ > /dev/null
                    curl -fsS http://localhost/api/info > /dev/null
                    echo "==> Despliegue completado y validado exitosamente (HTTP 200 OK)."
                  displayName: 'Pull y Despliegue con Docker Compose'

                - bash: |
                    set -euo pipefail
                    echo "========================================================"
                    echo " Sincronizando Release, Tags y Metadata en GitHub"
                    echo "========================================================"

                    git config user.name "Azure DevOps Pipeline"
                    git config user.email "devops-pipeline@azure.com"

                    # 1. Crear tag local si no existe
                    if ! git rev-parse "v$(SEMVER_TAG)" >/dev/null 2>&1; then
                      git tag -a "v$(SEMVER_TAG)" -m "Release v$(SEMVER_TAG) desplegado en Producción"
                      echo "==> Tag local v$(SEMVER_TAG) creado."
                    fi

                    # 2. Publicar tag, Release y Metadata si GITHUB_PAT está configurado
                    if [ -n "${GITHUB_PAT:-}" ] && [ "${GITHUB_PAT}" != "\$(GITHUB_PAT)" ]; then
                      echo "==> Publicando tag v$(SEMVER_TAG) en GitHub..."
                      git push "https://${GITHUB_PAT}@github.com/maxivalenzano/dev-ops-clase-2.git" "v$(SEMVER_TAG)" || echo "==> Tag ya existía en GitHub."

                      echo "==> Creando/actualizando GitHub Release oficial para v$(SEMVER_TAG)..."

                      # Extraer historial de commits para generar Changelog dinámico
                      LAST_TAG=$(git describe --tags --abbrev=0 --match "v[0-9]*" "v$(SEMVER_TAG)^" 2>/dev/null || echo "")
                      if [ -n "$LAST_TAG" ]; then
                        LOG_RANGE="${LAST_TAG}..v$(SEMVER_TAG)"
                      else
                        LOG_RANGE="v$(SEMVER_TAG)"
                      fi

                      echo "==> Extrayendo commits para Changelog en rango: ${LOG_RANGE}"
                      COMMITS_CHANGELOG=$(git log ${LOG_RANGE} --pretty=format:"* %s ([%h](https://github.com/maxivalenzano/dev-ops-clase-2/commit/%H))" 2>/dev/null || echo "* Despliegue de versión v$(SEMVER_TAG)")

                      RELEASE_BODY=$(cat <<EOF
## 🚀 Release v$(SEMVER_TAG)

### 🌐 Despliegue en Vivo
- **URL**: [http://devops-maxivalenzano.com](http://devops-maxivalenzano.com) (o IP directa http://68.211.137.116)
- **Infraestructura**: Azure VM Ubuntu (Docker Compose + Nginx Gateway + 3 nodos Backend .NET 10 + Frontend React 18 + Redis)
- **Seguridad & Calidad**: SonarQube Cloud Quality Gate & Trivy Security Scanner

### 📋 Changelog de la versión
${COMMITS_CHANGELOG}

---
*Despliegue y Release automatizado mediante Azure DevOps Multi-Stage Pipeline.*
EOF
)

                      RELEASE_JSON=$(jq -n \
                        --arg tag "v${SEMVER_TAG}" \
                        --arg name "Release v${SEMVER_TAG}" \
                        --arg body "$RELEASE_BODY" \
                        '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false, generate_release_notes: true}')
                      curl -fsS -X POST \
                        -H "User-Agent: AzureDevOps-Pipeline" \
                        -H "Authorization: Bearer ${GITHUB_PAT}" \
                        -H "Accept: application/vnd.github+json" \
                        -H "X-GitHub-Api-Version: 2022-11-28" \
                        https://api.github.com/repos/maxivalenzano/dev-ops-clase-2/releases \
                        -d "$RELEASE_JSON" || echo "==> [Aviso] El Release ya existía o API no lo requirió."

                      echo "==> Actualizando Metadata de portada en GitHub (About, Website y Topics)..."
                      curl -fsS -X PATCH \
                        -H "User-Agent: AzureDevOps-Pipeline" \
                        -H "Authorization: Bearer ${GITHUB_PAT}" \
                        -H "Accept: application/vnd.github+json" \
                        -H "X-GitHub-Api-Version: 2022-11-28" \
                        https://api.github.com/repos/maxivalenzano/dev-ops-clase-2 \
                        -d '{
                          "description": "🚀 DevOps Lab: Microservices (.NET 10 & React 18), Nginx Gateway, automated CI/CD in Azure DevOps with SemVer & Docker Compose.",
                          "homepage": "http://devops-maxivalenzano.com"
                        }' || echo "==> [Aviso] No se pudo actualizar descripción/homepage (revisar permisos del token)."

                      curl -fsS -X PUT \
                        -H "User-Agent: AzureDevOps-Pipeline" \
                        -H "Authorization: Bearer ${GITHUB_PAT}" \
                        -H "Accept: application/vnd.github+json" \
                        -H "X-GitHub-Api-Version: 2022-11-28" \
                        https://api.github.com/repos/maxivalenzano/dev-ops-clase-2/topics \
                        -d '{
                          "names": ["devops", "azure-devops", "docker-compose", "podman", "dotnet10", "react18", "nginx", "semver", "ci-cd", "microservices"]
                        }' || echo "==> [Aviso] No se pudieron actualizar los topics."

                      echo "==> Registrando despliegue oficial en GitHub Deployments API..."
                      COMMIT_SHA="$(Build.SourceVersion)"
                      DEPLOY_RES=$(curl -s -X POST \
                        -H "User-Agent: AzureDevOps-Pipeline" \
                        -H "Authorization: Bearer ${GITHUB_PAT}" \
                        -H "Accept: application/vnd.github+json" \
                        -H "X-GitHub-Api-Version: 2022-11-28" \
                        https://api.github.com/repos/maxivalenzano/dev-ops-clase-2/deployments \
                        -d "{
                          \"ref\": \"${COMMIT_SHA}\",
                          \"environment\": \"Production\",
                          \"description\": \"Despliegue v${SEMVER_TAG} en Azure VM\",
                          \"auto_merge\": false,
                          \"required_contexts\": []
                        }" || echo "{}")

                      DEPLOY_ID=$(echo "$DEPLOY_RES" | jq -r '.id // empty')
                      if [ -n "$DEPLOY_ID" ]; then
                        echo "==> Deployment creado en GitHub con ID: $DEPLOY_ID. Reportando estado 'success'..."
                        curl -s -X POST \
                          -H "User-Agent: AzureDevOps-Pipeline" \
                          -H "Authorization: Bearer ${GITHUB_PAT}" \
                          -H "Accept: application/vnd.github+json" \
                          -H "X-GitHub-Api-Version: 2022-11-28" \
                          https://api.github.com/repos/maxivalenzano/dev-ops-clase-2/deployments/${DEPLOY_ID}/statuses \
                          -d "{
                            \"state\": \"success\",
                            \"environment_url\": \"http://devops-maxivalenzano.com\",
                            \"description\": \"Despliegue v${SEMVER_TAG} verificado en vivo con Smoke Tests\"
                          }" > /dev/null
                        echo "==> GitHub Deployments actualizado exitosamente a 'success'."
                      else
                        echo "==> [Aviso] No se pudo crear el deployment en GitHub: $DEPLOY_RES"
                      fi

                      echo "==> Sincronización con GitHub completada exitosamente."
                    else
                      echo "==> [Aviso] GITHUB_PAT no configurado en variables de Azure DevOps. Se omite actualización en GitHub."
                    fi
                  displayName: 'Sincronizar Release, Tags y Metadata en GitHub'
                  continueOnError: true
                  env:
                    GITHUB_PAT: $(GITHUB_PAT)
